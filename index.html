<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#172f68" />
    <title>INAYA Survey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <header class="header">
        <a class="brand" href="#" aria-label="Inaya Medical Colleges">
          <img
            class="brand-logo"
            src="inaya-logo.png"
            alt="Inaya Medical Colleges"
          />
        </a>

        <button id="language-toggle" class="language-btn" type="button">
          العربية
        </button>
      </header>

      <section id="survey-app" aria-label="Survey">
        <div id="progress"></div>
        <div id="survey-content"></div>
        <div id="navigation"></div>
        <div id="message" role="status" aria-live="polite"></div>
      </section>

    </main>

    <script src="survey.js"></script>
  </body>
</html>
